services:
  migrate:
    build: .
    environment:
      DATABASE_HOST: 172.17.0.1
      DATABASE_PORT: 3306
      DATABASE_USERNAME: ${DATABASE_USERNAME:-root}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-root}
      DATABASE_NAME: ${DATABASE_NAME:-portfolio_db}
    command: >
      sh -c "for i in $$(seq 1 10); do ./node_modules/.bin/ts-node -r tsconfig-paths/register ./node_modules/typeorm/cli.js -d src/infrastructures/database/config.ts migration:run && exit 0; echo '[migrate] DB not ready, retry $$i/10...'; sleep 5; done; exit 1"
    restart: "no"

  api:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_HOST: 172.17.0.1
      DATABASE_PORT: 3306
      DATABASE_USERNAME: ${DATABASE_USERNAME:-root}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-root}
      DATABASE_NAME: ${DATABASE_NAME:-portfolio_db}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./storages:/app/storages
    depends_on:
      migrate:
        condition: service_completed_successfully
